name: QA Café Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: 

jobs:

  analyse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # TODO: Add flake8 linting here
      - name: install flake8
        run: pip install flake8

      - name: run flake8
        run: flake8

  package:
    runs-on: ubuntu-latest
    needs: analyse

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # TODO: Zip the application here
      - name: Zip application files
        uses: xmlking/zip-action@v1.0.2
        run: zip -r qacafe-app.zip
          